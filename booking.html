<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Book a Flight | No Way Home</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <img src="NWH_Logo-removebg-preview.png" alt="Logo" style="height: 100px; margin-bottom: 10px;" />
      <button class="about-btn">About</button>
    </div>
  </header>

  <main>
    <div class="login-container spin-pop-in">
      <h2>🛫 Book Your Flight</h2>
      <form id="booking-form">
        <label>From</label>
        <input type="text" id="from" required />

        <label>To</label>
        <input type="text" id="to" required />

        <label>Travel Date</label>
        <input type="date" id="date" required />

        <button type="submit">Book (or so you think !)</button>
      </form>
    </div>
  </main>

  <!-- SAN-AI BOT ICON -->
  <div id="sanai-icon" class="sanai-icon">🤖</div>

  <!-- SAN-AI BOT WINDOW -->
  <div id="sanai-window" class="sanai-window hidden">
    <div class="sanai-header">
      <span>SAN-AI – Trip Advisor</span>
      <button class="close-btn" id="close-bot">❌</button>
    </div>
    <div class="sanai-body">
      <div class="chat-area" id="chat-area">
        <p><strong>SAN-AI:</strong> Where do you dream to go? 🌍</p>
      </div>
      <div class="wishlist-panel">
        <h3>Just Book It!!</h3>
        <ul id="wishlist-items"></ul>
      </div>
    </div>
    <div class="sanai-input">
      <input type="text" id="user-input" placeholder="Ask SAN-AI something..." />
      <button id="send-btn">Send</button>
    </div>
  </div>

  <script type="module" src="./booking.js"></script>
</body>
</html>
