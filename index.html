<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>No Way Home | Login</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat&display=swap" rel="stylesheet">
  <script type="module" src="auth.js" defer></script>
</head>
<body>
  <header>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <img src="NWH_Logo-removebg-preview.png" alt="Logo" style="height: 100px; margin-bottom: 10px;" />
      <button class="about-btn">About</button>
    </div>
  </header>

  <main>
    <div class="login-container">
      <h2>LOGIN</h2>
      <form id="auth-form">
        <label>Email Address</label>
        <input type="email" id="email" required />
        <label>Password</label>
        <input type="password" id="password" required />
        <button type="submit" id="auth-btn">LOGIN</button>
        <p id="toggle-text">New user? <span id="toggle-link">Sign Up</span></p>
      </form>
    </div>
  </main>
</body>
</html>
