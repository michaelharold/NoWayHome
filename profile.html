<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Profile Setup | No Way Home</title>
  <link rel="stylesheet" href="style.css" />
 <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Montserrat&display=swap" rel="stylesheet">
  <script type="module" src="profile.js" defer></script>
</head>
<body>
  <header>
    <div style="display: flex; flex-direction: column; align-items: center; justify-content: center;">
      <img src="NWH_Logo-removebg-preview.png" alt="Logo" style="height: 100px; margin-bottom: 10px;" />
      <button class="about-btn">About</button>
    </div>
  </header>

  <main>
    <div class="login-container pop-in">
      <h2>Complete Your Profile</h2>
      <form id="profile-form">
        <label style="font-size: 0.95rem; padding-bottom: 4px; padding-top: 12px; display: block;">Home Country</label>
        <input type="text" id="home-country" required />

        <label style="font-size: 0.95rem; padding-bottom: 4px; padding-top: 12px; display: block;">Wishlist Destinations (comma separated)</label>
        <input type="text" id="wishlist" required />

        <label style="font-size: 0.95rem; padding-bottom: 4px; padding-top: 12px; display: block;">Favorite Food</label>
        <input type="text" id="food" required />

        <label style="font-size: 0.95rem; padding-bottom: 4px; padding-top: 12px; display: block;">Preferred Movie Genre</label>
        <input type="text" id="genre" required />

        <button type="submit">Save & Continue</button>
      </form>
    </div>
  </main>
</body>
</html>
