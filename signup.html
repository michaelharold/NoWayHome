<!-- signup.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Signup | NowayHome</title>
  <script type="module" src="./js/auth.js" defer></script>
</head>
<body>
  <h2>Create Account</h2>
  <form id="signupForm">
    <input type="email" placeholder="Email" id="email" required />
    <input type="password" placeholder="Password" id="password" required />
    <input type="text" placeholder="Hometown" id="hometown" required />
    <textarea placeholder="Wishlist Places (comma separated)" id="wishlist"></textarea>
    <button type="submit">Sign Up</button>
  </form>
</body>
</html>
