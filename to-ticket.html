<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>TO Ticket Booking | No Way Home</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body >
  <header>
    <h1><span class="bold">No Way</span> Home ✈️</h1>
    <p class="tagline">You pick the flight ✈️ We pick the fate</p>
  
  </header>

  <main class="login-container">
    <h2>🛬 Book Your TO Ticket</h2>
    <form id="to-ticket-form">
      <label>From</label>
      <input type="text" id="from" required />

      <label>To</label>
      <input type="text" id="to" required />

      <label>Travel Date</label>
      <input type="date" id="date" required />

      <button type="submit">Book Ticket</button>
    </form>
  </main>

  <!-- 🤖 SAN-AI Bot -->
  <div id="sanai-icon" class="sanai-icon">🤖</div>

  <div id="sanai-window" class="sanai-window hidden">
    <div class="sanai-header">
      <span>SAN-AI – Trip Advisor</span>
      <button class="close-btn" id="close-bot">❌</button>
    </div>
    <div class="sanai-body">
      <div class="chat-area" id="chat-area">
        <p><strong>SAN-AI:</strong> I see you’re trying to be in control... cute.</p>
      </div>

      <div class="chat-input">
        <input type="text" id="user-input" placeholder="Say something..." />
        <button id="send-btn">Send</button>
      </div>

      <div class="wishlist-panel">
        <h3>Just Book It!!</h3>
        <ul id="wishlist-items"></ul>
      </div>
    </div>
  </div>

  <script>
    // Redirect to movie-booked page
    document.getElementById('to-ticket-form').addEventListener('submit', function(e) {
      e.preventDefault();
      const from = document.getElementById('from').value;
      const to = document.getElementById('to').value;
      const date = document.getElementById('date').value;

      localStorage.setItem('toFlight', JSON.stringify({ from, to, date }));
      window.location.href = 'movie-booked.html';
    });

    // Bot toggle
    const sanaiIcon = document.getElementById("sanai-icon");
    const sanaiWindow = document.getElementById("sanai-window");
    const closeBtn = document.getElementById("close-bot");

    sanaiIcon.addEventListener("click", () => sanaiWindow.classList.remove("hidden"));
    closeBtn.addEventListener("click", () => sanaiWindow.classList.add("hidden"));

    // Wishlist logic
    const wishlist = JSON.parse(localStorage.getItem("userWishlist")) || [];
    const wishlistContainer = document.getElementById("wishlist-items");
    wishlist.forEach(item => {
      const li = document.createElement("li");
      li.textContent = item;
      wishlistContainer.appendChild(li);
    });

    // Chat logic
    const sendBtn = document.getElementById("send-btn");
    const userInput = document.getElementById("user-input");
    const chatArea = document.getElementById("chat-area");

    sendBtn.addEventListener("click", sendMessage);
    userInput.addEventListener("keypress", (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        sendMessage();
      }
    });

    function sendMessage() {
      const message = userInput.value.trim();
      if (!message) return;

      const userMsg = document.createElement("p");
      userMsg.innerHTML = `<strong>You:</strong> ${message}`;
      chatArea.appendChild(userMsg);

      const botMsg = document.createElement("p");
      botMsg.innerHTML = `<strong>SAN-AI:</strong> I'll pretend I understood that. 😅`;
      chatArea.appendChild(botMsg);

      userInput.value = "";
      chatArea.scrollTop = chatArea.scrollHeight;
    }
  </script>
</body>
</html>
