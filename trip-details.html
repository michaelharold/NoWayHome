<!-- trip-details.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <title>Trip Summary | NowayHome</title>
  <script type="module">
    const data = JSON.parse(localStorage.getItem('tripDetails'));
    if (data) {
      document.write(`<h2>✅ Booking Summary</h2>
        <p>🛫 Going: ${data.from} ➡️ ${data.to} on ${data.date}</p>
        <p>🔁 Return: ${data.returnFrom} ➡️ ${data.from} on ${data.returnDate}</p>
        <p>🎬 Movie ticket booked 2 days before return</p>
      `);
    }
  </script>
</head>
<body></body>
</html>
